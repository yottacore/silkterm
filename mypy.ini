##	mypy settings for the repo's own Python scripts. cicd/utility/py-lint.py
##	runs it from the repo root, after ruff.
[mypy]
strict = True
cache_dir = target/mypy
##	Where the scripts that put them on sys.path find mdtable.py and _testdir.py.
mypy_path = utility/include:cicd/tests

##	python-xlib ships no type hints.
[mypy-Xlib.*]
ignore_missing_imports = True

##	Only the demo recorder uses them. Skipped rather than looked up, so the
##	answer does not depend on what this box has installed.
[mypy-numpy.*,scipy.*]
follow_imports = skip
ignore_missing_imports = True
