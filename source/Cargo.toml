[package]
name = "silkterm"
version = "1.0.0-beta3"
edition = "2024"
rust-version = "1.96"
description = "Smooth-scrolling GUI terminal emulator with split panes"
license = "GPL-2.0-or-later"
repository = "https://github.com/yottacore/silkterm"

[[bin]]
name = "silkterm"
path = "src/main.rs"

# Dev-only diagnostic (not a usage example): a no-window probe that renders glyphon
# text on a native wgpu-GL device, to bisect GL/transparency text-render regressions.
# Lives in diagnostics/, not examples/. Wired as a Cargo "example" only because that
# target type stays out of `cargo build --release` (zero shipped-binary cost) yet runs
# on demand: `cargo run --example glyphon_gl` (compile-checked by `cargo test`).
[[example]]
name = "glyphon_gl"
path = "diagnostics/glyphon_gl.rs"

# Packaging metadata for the cicd packages stage. cargo-deb (.deb) and
# cargo-generate-rpm (.rpm) read these; both package the already-built release
# binary (--no-build), per-arch via --target. The binary links only libc + system
# libs, so no explicit runtime depends are needed. Asset paths are relative to
# this manifest; the "target/release/" prefix is remapped to the real target dir
# (and to target/<triple>/release when --target is given).
[package.metadata.deb]
maintainer = "Jim Collier <jim-collier@users.noreply.github.com>"
copyright = "2026, Jim Collier"
license-file = ["../license.md", "0"]
extended-description = "GPU-accelerated terminal with smooth scrolling, split panes, tabs, true-color and Unicode, and true per-pixel background transparency."
section = "utils"
priority = "optional"
assets = [
	["target/release/silkterm", "usr/bin/", "755"],
	["../cicd/packaging/linux/silkterm.desktop", "usr/share/applications/", "644"],
	["../cicd/packaging/linux/icons/16x16/silkterm.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
	["../cicd/packaging/linux/icons/24x24/silkterm.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
	["../cicd/packaging/linux/icons/32x32/silkterm.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
	["../cicd/packaging/linux/icons/48x48/silkterm.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
	["../cicd/packaging/linux/icons/64x64/silkterm.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
	["../cicd/packaging/linux/icons/128x128/silkterm.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
	["../cicd/packaging/linux/icons/256x256/silkterm.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

[package.metadata.generate-rpm]
summary = "Smooth-scrolling GUI terminal emulator with split panes"
assets = [
	{ source = "target/release/silkterm", dest = "/usr/bin/silkterm", mode = "755" },
	{ source = "../cicd/packaging/linux/silkterm.desktop", dest = "/usr/share/applications/silkterm.desktop", mode = "644" },
	{ source = "../cicd/packaging/linux/icons/16x16/silkterm.png", dest = "/usr/share/icons/hicolor/16x16/apps/silkterm.png", mode = "644" },
	{ source = "../cicd/packaging/linux/icons/24x24/silkterm.png", dest = "/usr/share/icons/hicolor/24x24/apps/silkterm.png", mode = "644" },
	{ source = "../cicd/packaging/linux/icons/32x32/silkterm.png", dest = "/usr/share/icons/hicolor/32x32/apps/silkterm.png", mode = "644" },
	{ source = "../cicd/packaging/linux/icons/48x48/silkterm.png", dest = "/usr/share/icons/hicolor/48x48/apps/silkterm.png", mode = "644" },
	{ source = "../cicd/packaging/linux/icons/64x64/silkterm.png", dest = "/usr/share/icons/hicolor/64x64/apps/silkterm.png", mode = "644" },
	{ source = "../cicd/packaging/linux/icons/128x128/silkterm.png", dest = "/usr/share/icons/hicolor/128x128/apps/silkterm.png", mode = "644" },
	{ source = "../cicd/packaging/linux/icons/256x256/silkterm.png", dest = "/usr/share/icons/hicolor/256x256/apps/silkterm.png", mode = "644" },
]

[dependencies]
alacritty_terminal = "0.26"
# The crate alacritty_terminal registers its PTY with. Named here only so the
# tapped PTY in cwd.rs can implement that trait, which speaks in these types -
# it resolves to the version already in the tree, so nothing new is linked.
polling = "3.8"
wgpu = "29"
winit = "0.30"
glyphon = "0.11"
# COLRv1 color glyphs (see coloremoji.rs). Both already link via swash; the
# feature sets below match what swash resolves, so this adds no new crate and no
# feature churn - only the paint-graph + rasterizer code we actually call.
skrifa = { version = "0.42", default-features = false, features = ["std"] }
zeno = { version = "0.3", default-features = false, features = ["std", "eval"] }
pollster = "0.4"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
# Config format. Zero dependencies, and its parser is forgiving by design: one
# bad line yields a diagnostic instead of sinking the whole file, so the config
# layer needs no hand-rolled error recovery of its own.
shcl = "2.0.0"
copypasta = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# X11 per-pixel transparency: wgpu's GLES surface can't bind the window's ARGB
# visual, so create a transparent GL context with glutin and run wgpu on it
# (hal external interop). Cross-platform crate; only used on X11 at runtime.
glutin = "0.32"
glutin-winit = "0.5"

# Profiler stage of the local CI/CD (cicd/). Dev-only: optional + feature-gated,
# so it never compiles into a normal/release build (zero shipped-binary cost).
# LICENSE: pprof pulls inferno (CDDL-1.0, GPL-incompatible) - fine for local dev
# tooling, but binaries built with --features profiling must never be shipped.
# In-process sampling (SIGPROF) -> flamegraph SVG; sidesteps perf_event_paranoid.
# Linux-only path (cicd builds with --features profiling on this box).
pprof = { version = "0.14", features = ["flamegraph"], optional = true }

[features]
profiling = ["dep:pprof"]

[lints]
workspace = true

# X11: set _KDE_NET_WM_BLUR_BEHIND_REGION so a KWin/picom compositor blurs the
# desktop behind the translucent window (transparent_background_blur), and read
# a monitor's size in mm through RandR (monitor.rs). winit already turns randr on.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
# XErrorEvent, for the GLX error hook in gfx.rs. Already in the tree through winit.
x11-dl = "2.21"

# macOS: the system font sizes (sysfont.rs), the part of the screen a window
# can use, below the menu bar and clear of the Dock (dialog.rs), and the menu
# bar itself (macmenu.rs). Already in the tree through wgpu and glutin.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSCell",
    "NSEvent",
    "NSFont",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }

# Unix: tcgetpgrp() on the PTY master to read the foreground program for tab titles.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Profiles (release/dev/profiling) live in the workspace root Cargo.toml -
# Cargo ignores profile sections in member crates.

# windows: detect the system font size (no console window in release is set in
# main.rs), join the launching console so the CLI-only flags can print, ask
# whether standard input is a console at all (config::launched_from_shell), and
# walk the process table for the shell's live child (copy-output's stand-in for a
# foreground process group - see term.rs at_shell_prompt), and ask whether a
# settings file's name is only waiting for its delete (config.rs delete_pending).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Embed the Windows icon resource (build.rs). Host-side build tool, so it stays
# unconditional - a cfg(windows) gate here would be false when cross-compiling to
# windows from Linux. compile() no-ops on non-windows targets. It locates the
# resource compiler via the cc crate (reliable msvc SDK + mingw windres lookup).
[build-dependencies]
embed-resource = "3"

[package.metadata.silkterm]
note = "see build.md for cross-compile + macOS instructions"
